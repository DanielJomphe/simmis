<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* simmis palette — mirrors the app's core.css tokens (monochrome + one blue
       accent). Light by default, dark via the OS preference; the app keeps the
       same blue in both, no neon. */
    :root {
      --bg-base: #ffffff; --bg-surface: #f9f9f8; --bg-elevated: #f3f3f1;
      --border: #e0dfdd; --border-subtle: #ebebea;
      --text-1: #1a1a19; --text-2: #6b6b6a; --text-3: #9a9a99;
      --accent: #2563eb; --accent-subtle: rgba(37, 99, 235, 0.08);
      --online: #22c55e; --error: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #0a0a0a; --bg-surface: #111111; --bg-elevated: #1a1a1a;
        --border: #2a2a2a; --border-subtle: #1f1f1f;
        --text-1: #e0e0e0; --text-2: #888888; --text-3: #555555;
        --accent: #2563eb; --accent-subtle: rgba(37, 99, 235, 0.16);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px; color: var(--text-1); background: var(--bg-base);
    }
    .header {
      padding: 12px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
    .status-dot.connected { background: var(--online); }
    .status-dot.error { background: var(--error); }

    .section { padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }
    .section-title {
      font-size: 11px; text-transform: uppercase; color: var(--text-3);
      margin-bottom: 8px; letter-spacing: 0.05em;
    }
    label { display: block; font-size: 11px; color: var(--text-2); margin-bottom: 4px; }
    input[type="text"], input[type="email"], input[type="password"], textarea {
      width: 100%; padding: 7px 9px; background: var(--bg-base); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-1); font-size: 12px; margin-bottom: 6px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 54px; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }

    .btn {
      padding: 7px 12px; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-2); border: 1px solid var(--border); }
    .btn-secondary:hover { color: var(--text-1); filter: none; border-color: var(--text-3); }
    .btn-capture { width: 100%; padding: 10px; font-size: 13px; }
    .btn-capture:disabled { background: var(--bg-elevated); color: var(--text-3); cursor: not-allowed; border: 1px solid var(--border); }

    .row { display: flex; align-items: center; gap: 8px; }
    .muted { color: var(--text-3); font-size: 11px; }
    .logged-in { color: var(--text-2); font-size: 12px; }
    .hidden { display: none; }

    .captures { max-height: 160px; overflow-y: auto; }
    .capture-item { padding: 7px 0; border-bottom: 1px solid var(--border-subtle); font-size: 12px; }
    .capture-item:last-child { border-bottom: none; }
    .capture-title { color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .capture-meta { color: var(--text-3); font-size: 11px; margin-top: 2px; }
    .capture-status { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; }
    .capture-status.received { background: var(--accent-subtle); color: var(--accent); }
    .capture-status.pending { background: var(--bg-elevated); color: var(--text-2); }
    .capture-status.error, .capture-status.auth-expired, .capture-status.not-logged-in,
    .capture-status.connection-error { background: rgba(239,68,68,0.12); color: var(--error); }
    .empty { color: var(--text-3); font-style: italic; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot" id="statusDot"></div>
    <h1>simmis Web Intake</h1>
  </div>

  <!-- Login (shown when signed out) -->
  <div class="section" id="loginSection">
    <div class="section-title">Sign in to simmis</div>
    <label for="urlInput">simmis URL</label>
    <input type="text" id="urlInput" placeholder="https://dev.simm.is">
    <label for="emailInput">Email</label>
    <input type="email" id="emailInput" placeholder="you@simm.is">
    <label for="passwordInput">Password</label>
    <input type="password" id="passwordInput" placeholder="••••••••">
    <button class="btn" id="loginBtn">Sign in</button>
    <div class="muted" id="loginError" style="margin-top:6px;"></div>
  </div>

  <!-- Account (shown when signed in) -->
  <div class="section hidden" id="accountSection">
    <div class="row" style="justify-content: space-between;">
      <span class="logged-in" id="accountLabel">Signed in</span>
      <button class="btn btn-secondary" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="section">
    <button class="btn btn-capture" id="captureBtn">Capture This Page</button>
  </div>

  <div class="section">
    <div class="section-title">Auto-capture</div>
    <div class="row" style="margin-bottom: 8px;">
      <input type="checkbox" id="autoCapture" checked>
      <label for="autoCapture" style="margin: 0; cursor: pointer;">Auto-capture pages on my allowlist</label>
    </div>
    <label for="allowlistInput">Allowlist — one domain per line</label>
    <textarea id="allowlistInput" placeholder="linkedin.com&#10;news.ycombinator.com"></textarea>
    <button class="btn" id="saveBtn">Save</button>
    <div class="muted" style="margin-top: 6px;">Sensitive sites (banking, email, auth, health) are never auto-captured.</div>
  </div>

  <div class="section">
    <div class="section-title">Recent Captures</div>
    <div class="captures" id="capturesList"><div class="empty">No captures yet</div></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
